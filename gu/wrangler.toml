name = "kdp-gu"
pages_build_output_dir = "./dist"
compatibility_date = "2026-09-16"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "production"
OTP_FROM = "otp@kdp.cool"

[[d1_databases]]
binding = "DB"
database_name = "gu-production"
database_id = "8fc889ca-b3e6-493e-90ba-01aa0e1c82da"
migrations_dir = "migrations"

[env.preview.vars]
ENVIRONMENT = "preview"
OTP_FROM = "otp@kdp.cool"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "gu-preview"
database_id = "4c62889c-b7d1-4cd9-bd75-f959276cee61"
migrations_dir = "migrations"
