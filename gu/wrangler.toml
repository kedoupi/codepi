name = "codepi-gu"
pages_build_output_dir = "./dist"
compatibility_date = "2026-09-16"
compatibility_flags = ["nodejs_compat"]

[[services]]
binding = "AUTH"
service = "codepi-auth"

[vars]
SSO_ENABLED = "1"
AUTH_CLIENT_ID = "gu"
AUTH_ORIGIN = "https://auth.codepi.app"
ENVIRONMENT = "production"
OTP_FROM = "otp@kdp.cool"

[[d1_databases]]
binding = "DB"
database_name = "codepi-gu"
database_id = "4d3b6713-85dd-4f61-ac55-9925db72394b"
migrations_dir = "migrations"

[env.preview.vars]
SSO_ENABLED = "0"
AUTH_CLIENT_ID = "gu"
AUTH_ORIGIN = "https://auth.codepi.app"
ENVIRONMENT = "preview"
OTP_FROM = "otp@kdp.cool"

[[env.preview.services]]
binding = "AUTH"
service = "codepi-auth"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "codepi-gu-preview"
database_id = "2dd4b95a-e3a0-47ce-bda4-0598e523b350"
migrations_dir = "migrations"
