name = "oura-kdp-api"
main = "src/index.ts"
rules = [{ type = "Text", globs = ["**/tokens.css"], fallthrough = true }]
compatibility_date = "2025-01-01"
routes = [
  { pattern = "health.codepi.app/api/*", zone_name = "codepi.app" },
  { pattern = "health.codepi.app/mcp", zone_name = "codepi.app" },
  { pattern = "health.codepi.app/oauth*", zone_name = "codepi.app" },
  { pattern = "health.codepi.app/.well-known*", zone_name = "codepi.app" }
]

[vars]
AUTO_SYNC_ENABLED = "1"
ALLOW_DEV_LOGIN = "0"
SSO_ENABLED = "1"
AUTH_CLIENT_ID = "oura"
AUTH_ORIGIN = "https://auth.codepi.app"
FRONTEND_ORIGIN = "https://health.codepi.app"
FRONTEND_ORIGINS = "https://health.codepi.app"
OURA_REDIRECT_URI = "https://health.codepi.app/api/auth/oura/callback"

[triggers]
crons = ["*/2 * * * *"]

[[services]]
binding = "AUTH"
service = "kdp-auth"

[[d1_databases]]
binding = "DB"
database_name = "oura_kdp"
# Production D1: oura_kdp
database_id = "a1a08301-b4f9-4b9c-a1d1-2dd04f9038ab"
migrations_dir = "../../migrations"

# Secrets via `wrangler secret put` / `.dev.vars` — never commit real values:
#   OURA_CLIENT_ID, OURA_CLIENT_SECRET, TOKEN_ENCRYPTION_KEY, SESSION_SECRET
# SSO rollout additionally needs AUTH_CLIENT_SECRET, PERSONAL_OWNER_ID and an
# AUTH service binding to the central auth Worker. Keep SSO_ENABLED=0 until that
# binding and the registered /api/auth/callback are ready.
# Production URLs and the API route are declared above.
# ALLOW_DEV_LOGIN=1 on preview/test Workers; unset / 0 in production.
