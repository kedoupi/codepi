# 发稿台 · Cloudflare Pages project `fagao`
# 生产域名：https://fagao.kdp.cool
# 密钥禁止写入本文件，只用 wrangler pages secret put（见 README）

"$schema" = "./node_modules/wrangler/config-schema.json"
name = "fagao"
pages_build_output_dir = "./dist"
compatibility_date = "2026-09-16"
compatibility_flags = ["nodejs_compat"]

# 一期空库已建好，与 oura D1 隔离
[[d1_databases]]
binding = "DB"
database_name = "fagao"
database_id = "44beaaee-2cfb-4f04-8c5a-242c03ad816e"
migrations_dir = "migrations"

[vars]
ALLOWLIST = "kedoupi@gmail.com"
OTP_FROM = "otp@kdp.cool"
ACCOUNT_BRAND = "珂抖屁"
ENVIRONMENT = "production"

# Pages 项目不支持 [observability]，已从本文件移除（否则 wrangler pages deploy 校验失败）

# Pages preview 部署共用同一套库名；上线前换成独立 preview D1 也可以
[env.preview]
compatibility_date = "2026-09-16"
compatibility_flags = ["nodejs_compat"]

[[env.preview.d1_databases]]
binding = "DB"
database_name = "fagao"
database_id = "44beaaee-2cfb-4f04-8c5a-242c03ad816e"
migrations_dir = "migrations"

[env.preview.vars]
ALLOWLIST = "kedoupi@gmail.com"
OTP_FROM = "otp@kdp.cool"
ACCOUNT_BRAND = "珂抖屁"
ENVIRONMENT = "preview"
