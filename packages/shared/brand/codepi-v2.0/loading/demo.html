<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CodePi Loading Preview v1.6</title><link rel="stylesheet" href="loading.css"><style>body{margin:0;background:#FAF8F4;color:#2D2A28;font:16px system-ui;padding:28px}h1{font-size:24px}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.panel{background:white;border:1px solid #E7E3DC;border-radius:16px;min-height:230px;display:grid;place-content:center;padding:16px;text-align:center}.panel.dark{background:#242321}.note{font-size:12px;color:#77716A}</style></head><body><h1>CodePi · Global Loading System</h1><p>v1.6 设计审核 Demo · 圆环为临时视觉占位，非最终 Logo 路径动画。</p><main><section class="panel"><div class="cp-loading" role="status" aria-live="polite"><div class="cp-loading__ring" aria-hidden="true" style="--cp-loading-size:64px"></div><div class="cp-loading__wordmark">Code<span>Pi</span></div><span>正在加载…</span></div><p class="note">Brand / 启动</p></section><section class="panel"><div class="cp-loading" role="status" aria-live="polite"><div class="cp-loading__ring" aria-hidden="true"></div><span>正在获取数据…</span></div><p class="note">Global / 数据初始化</p></section><section class="panel"><div class="cp-loading" role="status" aria-live="polite"><div class="cp-loading__ring" aria-hidden="true" style="--cp-loading-size:24px"></div><span>正在处理…</span></div><p class="note">Inline / 局部任务</p></section><section class="panel dark"><div class="cp-loading" data-theme="dark" role="status" aria-live="polite"><div class="cp-loading__dots" aria-hidden="true"><i></i><i></i><i></i></div><span>AI 正在思考中…</span></div><p class="note">AI / 深色主题</p></section></main></body></html>
