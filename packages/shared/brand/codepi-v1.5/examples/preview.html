<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CodePi Design Preview</title><link rel="stylesheet" href="../tokens.css"><style>body{margin:0;background:var(--color-background);color:var(--color-text);font-family:Inter,system-ui,sans-serif}main{max-width:1080px;margin:auto;padding:40px 20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}.card{background:var(--color-surface);border:1px solid var(--color-border);border-radius:14px;padding:20px}img{max-width:100%;height:auto}.btn{border:0;border-radius:10px;background:var(--color-action);color:var(--color-action-text);padding:13px 20px;font-weight:650}.btn:hover{background:var(--color-action-hover)}.btn:focus-visible{outline:3px solid var(--color-focus);outline-offset:3px}.muted{color:var(--color-text-muted)}</style><main><h1>CodePi <span style="color:var(--brand-orange)">Design System</span></h1><p class="muted">v1.3 · 02 石墨灰橙 · 设计审查预览</p><div class="grid"><div class="card"><h2>应用图标</h2><img src="../assets/exports/app-icon-warm-256.png" alt="CodePi App icon"></div><div class="card"><h2>网页字标</h2><img src="../assets/exports/wordmark-light.png" alt="CodePi wordmark"><button class="btn">开始使用</button></div><div class="card"><h2>社交头像</h2><img src="../assets/exports/avatar-orange-256.png" alt="CodePi avatar"></div></div></main></html>
