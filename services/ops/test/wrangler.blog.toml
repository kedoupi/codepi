name = "blog-synthetic"
main = "fixture-blog-worker.mjs"
compatibility_date = "2026-10-19"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

[[d1_databases]]
binding = "BLOG"
database_name = "blog-synthetic"
database_id = "00000000-0000-4000-8000-000000000007"

[[r2_buckets]]
binding = "BLOG_MEDIA"
bucket_name = "blog-synthetic-uploads"
