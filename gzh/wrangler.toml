# 发稿台 · Cloudflare Pages project `codepi-gzh`
# 生产域名：https://gzh.codepi.app
# 密钥禁止写入本文件，只用 wrangler pages secret put（见 README）

"$schema" = "./node_modules/wrangler/config-schema.json"
name = "codepi-gzh"
pages_build_output_dir = "./dist"
compatibility_date = "2026-09-16"
compatibility_flags = ["nodejs_compat"]

[[services]]
binding = "AUTH"
service = "codepi-auth"

# 一期空库已建好，与 oura D1 隔离
[[d1_databases]]
binding = "DB"
database_name = "codepi-gzh"
database_id = "acedb64c-d374-4e40-b61e-7df7f0766694"
migrations_dir = "migrations"

[vars]
SSO_ENABLED = "1"
AUTH_CLIENT_ID = "gzh"
AUTH_ORIGIN = "https://auth.codepi.app"
ALLOWLIST = "codepi@example.invalid"
OTP_FROM = "otp@kdp.cool"
ACCOUNT_BRAND = "珂抖屁"
ENVIRONMENT = "production"

# Pages 项目不支持 [observability]，已从本文件移除（否则 wrangler pages deploy 校验失败）

# Pages preview 环境 = staging runtime（治理规范第 4 节）：仅由 staging branch
# 通过 Actions 上传，绑定 staging D1 与 codepi-auth-staging；禁止连接生产资源。
[env.preview]
compatibility_date = "2026-09-16"
compatibility_flags = ["nodejs_compat"]

[[env.preview.services]]
binding = "AUTH"
service = "codepi-auth-staging"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "codepi-gzh-staging"
database_id = "5162cf66-7bf8-4ba9-9758-5c546e13582f"
migrations_dir = "migrations"

[env.preview.vars]
SSO_ENABLED = "1"
AUTH_CLIENT_ID = "gzh"
AUTH_ORIGIN = "https://auth-staging.codepi.app"
ALLOWLIST = "codepi@example.invalid"
OTP_FROM = "otp@kdp.cool"
ACCOUNT_BRAND = "珂抖屁"
ENVIRONMENT = "staging"
