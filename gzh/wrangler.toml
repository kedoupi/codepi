# 发稿台 · Cloudflare Pages project `gzh`
# 生产域名：https://gzh.codepi.app
# 密钥禁止写入本文件，只用 wrangler pages secret put（见 README）

"$schema" = "./node_modules/wrangler/config-schema.json"
name = "codepi-gzh"
pages_build_output_dir = "./dist"
compatibility_date = "2026-09-16"
compatibility_flags = ["nodejs_compat"]

[[services]]
binding = "AUTH"
service = "codepi-auth"

# 一期空库已建好，与 oura D1 隔离
[[d1_databases]]
binding = "DB"
database_name = "codepi-gzh"
database_id = "346f7627-3365-47df-ba40-6762072c5613"
migrations_dir = "migrations"

[vars]
SSO_ENABLED = "1"
AUTH_CLIENT_ID = "gzh"
AUTH_ORIGIN = "https://auth.codepi.app"
ALLOWLIST = "kedoupi@gmail.com"
OTP_FROM = "otp@kdp.cool"
ACCOUNT_BRAND = "珂抖屁"
ENVIRONMENT = "production"

# Pages 项目不支持 [observability]，已从本文件移除（否则 wrangler pages deploy 校验失败）

# Pages preview 部署共用同一套库名；上线前换成独立 preview D1 也可以
[env.preview]
compatibility_date = "2026-09-16"
compatibility_flags = ["nodejs_compat"]

[[env.preview.services]]
binding = "AUTH"
service = "codepi-auth"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "codepi-gzh"
database_id = "346f7627-3365-47df-ba40-6762072c5613"
migrations_dir = "migrations"

[env.preview.vars]
SSO_ENABLED = "0"
AUTH_CLIENT_ID = "gzh"
AUTH_ORIGIN = "https://auth.codepi.app"
ALLOWLIST = "kedoupi@gmail.com"
OTP_FROM = "otp@kdp.cool"
ACCOUNT_BRAND = "珂抖屁"
ENVIRONMENT = "preview"
