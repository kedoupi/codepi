name: D1 backup (manual fallback)

on:
  # Automatic scheduling now belongs to services/ops on Cloudflare.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d1-backup
  cancel-in-progress: false

jobs:
  backup:
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Export and encrypt
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/cloudflare/d1-backup.mjs --out backup-out
      - name: Store encrypted exports outside Cloudflare
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: d1-backup-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            backup-out/*.sql.enc
            backup-out/manifest.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
