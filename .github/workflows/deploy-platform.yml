name: Validate platform

# CI validates only. Releases run locally from merged main.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.npmrc'
      - 'services/**'
      - 'apps/**'
      - 'packages/**'
      - 'scripts/**'
      - '.github/workflows/deploy-platform.yml'
      - 'docs/development/**'
      - '.agents/**'
      - '.claude/**'
      - '.cursor/**'
      - '.github/copilot-instructions.md'
      - 'CLAUDE.md'
      - 'AGENTS.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      jobs: ${{ steps.plan.outputs.jobs }}
      has_jobs: ${{ steps.plan.outputs.has_jobs }}
      manual: ${{ steps.plan.outputs.manual }}
      shared_auth: ${{ steps.plan.outputs.shared_auth }}
      governance: ${{ steps.plan.outputs.governance }}
      workflow: ${{ steps.plan.outputs.workflow }}
      migrations: ${{ steps.plan.outputs.migrations }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - id: plan
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            node scripts/agent/ci-plan.mjs --base "$PR_BASE" --output "$GITHUB_OUTPUT"
          else
            node scripts/agent/ci-plan.mjs --output "$GITHUB_OUTPUT"
          fi

  governance:
    needs: plan
    if: ${{ needs.plan.outputs.governance == 'true' || needs.plan.outputs.workflow == 'true' || needs.plan.outputs.migrations == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - if: ${{ needs.plan.outputs.governance == 'true' || needs.plan.outputs.workflow == 'true' }}
        run: node --test scripts/cloudflare/*.test.mjs scripts/agent/*.test.mjs
      - if: ${{ needs.plan.outputs.governance == 'true' }}
        run: node scripts/cloudflare/validate-governance.mjs
      - if: ${{ needs.plan.outputs.workflow == 'true' }}
        run: node scripts/agent/lint.mjs
      - if: ${{ needs.plan.outputs.migrations == 'true' }}
        run: node scripts/agent/check-migrations.mjs

  package:
    needs: plan
    if: ${{ needs.plan.outputs.has_jobs == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.jobs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chinese fonts for browser screenshots
        if: ${{ matrix.app == 'health' || matrix.app == 'web' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: Run planned package checks
        env:
          COMMANDS: ${{ toJSON(matrix.commands) }}
          HEALTH_BROWSER_ARTIFACTS: ${{ runner.temp }}/health-browser-artifacts
          MCP_BROWSER_ARTIFACTS: ${{ runner.temp }}/mcp-browser-artifacts
          PROJECT_SMOKE_ARTIFACTS: ${{ runner.temp }}/project-browser-artifacts
          ME_SMOKE_ARTIFACTS: ${{ runner.temp }}/me-browser-artifacts
          DESK_BROWSER_ARTIFACTS: ${{ runner.temp }}/desk-browser-artifacts
        run: |
          node --input-type=module <<'NODE'
          import { spawnSync } from 'node:child_process';
          const commands = JSON.parse(process.env.COMMANDS);
          for (const command of commands) {
            const result = spawnSync('pnpm', [command.name, ...(command.args || [])], {
              cwd: '${{ matrix.cwd }}', stdio: 'inherit', env: process.env,
            });
            if (result.error || result.status !== 0) process.exit(result.status || 1);
          }
          NODE
      - name: Upload browser screenshots and diagnostics
        if: ${{ always() && (matrix.app == 'health' || matrix.app == 'mcp' || matrix.app == 'project' || matrix.app == 'me' || matrix.app == 'web') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ matrix.app }}-browser-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/health-browser-artifacts
            ${{ runner.temp }}/mcp-browser-artifacts
            ${{ runner.temp }}/project-browser-artifacts
            ${{ runner.temp }}/me-browser-artifacts
            ${{ runner.temp }}/desk-browser-artifacts
          if-no-files-found: ignore
          retention-days: 7

  shared-auth:
    needs: plan
    if: ${{ needs.plan.outputs.shared_auth == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: node --experimental-strip-types --test packages/shared/auth/client.test.mjs
