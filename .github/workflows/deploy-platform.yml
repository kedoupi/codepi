name: Deploy platform (auth / web / gu / gzh / health)

# 全部 Cloudflare 服务（Auth、Web、GU、GZH、Health）的唯一发布入口。
# 规则见 docs/development/cloudflare-governance.md 第 6 节：
# - DAG：governance gate → auth build/deploy/smoke → web/gu/gzh Workers
#   build/migrate/deploy/smoke → health API build/migrate/deploy/contract smoke
#   → health Pages build/deploy/smoke。下游在 predecessor success 或 skipped
#   时继续；failure 必须停止。
# - SSO/shared-auth/shared-email/shared-brand/shared-styles 改动标记全部五个
#   服务受影响；否则只标记对应 app 路径。
# - production 只接受 main 上的 SHA（GitHub `production` Environment 保护为
#   provider 前提，尚未验证已配置）。单主干自动发布，无 staging 分支。
# - PR 只运行测试和构建，不 migrate/deploy。
# - staging 已简化为单主干自动发布；按需云端预览另行处理。
# - 每个 deploy job 通过 scripts/cloudflare/deployment-evidence.mjs 记录
#   service/target/SHA/provider 标识/smoke 结果并上传 artifact（无 secret）。

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.npmrc'
      - 'services/auth/**'
      - 'apps/web/**'
      - 'apps/gu/**'
      - 'apps/gzh/**'
      - 'apps/health/**'
      - 'packages/shared/**'
      - 'scripts/cloudflare/**'
      - '.github/workflows/deploy-platform.yml'
  workflow_dispatch:
    inputs:
      target:
        description: 'Deployment target environment'
        required: true
        type: choice
        options: [production]
      app:
        description: 'App to redeploy (pending main changes are always included)'
        required: true
        default: 'all'
        type: choice
        options: [all, auth, web, gu, gzh, health]

permissions:
  contents: read
  actions: read

# Keep the complete production chain on one SHA at a time.
concurrency:
  group: platform-${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Reject dispatch target/ref mismatch
        # fail fast：production 只允许 main。
        if: >-
          ${{github.event_name == 'workflow_dispatch'
            && inputs.target == 'production' && github.ref != 'refs/heads/main'}}
        run: |
          echo "::error::workflow_dispatch target=production is only allowed on refs/heads/main, got ${{ github.ref }}"
          exit 1
      - run: node --test scripts/cloudflare/validate-governance.test.mjs scripts/cloudflare/deployment-evidence.test.mjs scripts/cloudflare/deploy-workflow.test.mjs scripts/cloudflare/check-pages.test.mjs
      - run: node scripts/cloudflare/validate-governance.mjs

  affected:
    runs-on: ubuntu-latest
    outputs:
      auth: ${{ steps.map.outputs.auth }}
      web: ${{ steps.map.outputs.web }}
      gu: ${{ steps.map.outputs.gu }}
      gzh: ${{ steps.map.outputs.gzh }}
      health: ${{ steps.map.outputs.health }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Determine affected services
        id: map
        env:
          EVENT: ${{ github.event_name }}
          APP: ${{ inputs.app }}
          SHA: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          all_trigger='^(package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|\.npmrc$|services/auth/|packages/shared/|scripts/cloudflare/|\.github/workflows/deploy-platform\.yml$)'
          mark_all() { for s in auth web gu gzh health; do echo "$s=yes" >> "$GITHUB_OUTPUT"; done; }
          if [ "$EVENT" != 'pull_request' ]; then
            current_main=$(git ls-remote origin refs/heads/main | cut -f1)
            if [ "$SHA" != "$current_main" ]; then
              echo "::error::This run is older than main; release the current main revision instead"
              exit 1
            fi
          fi
          for s in auth web gu gzh health; do echo "$s=no" >> "$GITHUB_OUTPUT"; done
          if [ "$EVENT" = 'workflow_dispatch' ]; then
            if [ "$APP" = 'all' ] || [ "$APP" = 'auth' ]; then
              mark_all
              exit 0
            else
              echo "$APP=yes" >> "$GITHUB_OUTPUT"
            fi
          fi
          if [ "$EVENT" = 'push' ] || [ "$EVENT" = 'workflow_dispatch' ]; then
            # Pending runs can be coalesced by GitHub concurrency. The last green
            # push covers a full release. Dispatch includes that backlog too.
            released=$(gh api "repos/$GH_REPO/actions/workflows/deploy-platform.yml/runs?branch=main&event=push&status=success&per_page=1" \
              --jq '.workflow_runs[0].head_sha // empty')
            if [ -z "$released" ] || ! git merge-base --is-ancestor "$released" "$SHA"; then
              mark_all
              exit 0
            else
              # A partially deployed failed release may then be reverted. Include
              # every touched path, even when the final tree matches the baseline.
              changed=$(git log --format= --name-only --no-renames "$released..$SHA") || {
                echo "::error::could not determine changed paths since the last successful release"
                exit 1
              }
            fi
          elif [ "$EVENT" = 'pull_request' ]; then
            changed=$(git diff --name-only "$PR_BASE...$PR_HEAD") || {
              echo "::error::could not determine changed paths for pull request range $PR_BASE...$PR_HEAD"
              exit 1
            }
          else
            echo "::error::unsupported event for affected-service mapping: $EVENT"
            exit 1
          fi
          if printf '%s\n' "$changed" | grep -qE "$all_trigger"; then
            mark_all
            exit 0
          fi
          if printf '%s\n' "$changed" | grep -qE '^apps/web/'; then
            echo 'web=yes' >> "$GITHUB_OUTPUT"
          fi
          if printf '%s\n' "$changed" | grep -qE '^apps/gu/'; then
            echo 'gu=yes' >> "$GITHUB_OUTPUT"
          fi
          if printf '%s\n' "$changed" | grep -qE '^apps/gzh/'; then
            echo 'gzh=yes' >> "$GITHUB_OUTPUT"
          fi
          if printf '%s\n' "$changed" | grep -qE '^apps/health/'; then
            echo 'health=yes' >> "$GITHUB_OUTPUT"
          fi


  # ---------------- Local checks ----------------

  auth-build:
    needs: [affected]
    if: >-
      ${{needs.affected.outputs.auth == 'yes'}}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/auth
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        run: pnpm install --frozen-lockfile
      - run: npm test
      - run: npm run typecheck

  www-build:
    needs: [affected]
    if: >-
      ${{needs.affected.outputs.web == 'yes'}}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        run: pnpm install --frozen-lockfile
      - run: npm test
      - run: npm run typecheck:desk
      - run: npm run build
      - run: npm run test:assets

  gu-build:
    needs: [affected]
    if: >-
      ${{needs.affected.outputs.gu == 'yes'}}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/gu
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        run: pnpm install --frozen-lockfile
      - run: npm test
      - run: npm run test:scripts
      - run: npm run typecheck
      - run: npm run build

  gzh-build:
    needs: [affected]
    if: >-
      ${{needs.affected.outputs.gzh == 'yes'}}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/gzh
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        run: pnpm install --frozen-lockfile
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  health-build:
    needs: [affected]
    if: >-
      ${{needs.affected.outputs.health == 'yes'}}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/health
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        run: pnpm install --frozen-lockfile
      - run: node --experimental-strip-types --test ../../packages/shared/auth/client.test.mjs
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm --filter @health-kdp/web build
      - run: pnpm test:assets
      - name: Install Chinese fonts for browser screenshots
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: Browser regression (normal and SSO)
        timeout-minutes: 15
        run: pnpm test:browser:built
        env:
          HEALTH_BROWSER_ARTIFACTS: ${{ runner.temp }}/health-browser-artifacts
      - name: Upload browser screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: health-browser-${{ github.run_attempt }}
          path: ${{ runner.temp }}/health-browser-artifacts
          if-no-files-found: ignore
          retention-days: 7

  # ---------------- Auth ----------------

  auth-deploy-production:
    needs: [governance, affected, auth-build]
    if: >-
      ${{!failure() && !cancelled() && needs.affected.outputs.auth == 'yes'
        && ((github.event_name == 'push' && github.ref == 'refs/heads/main')
          || (github.event_name == 'workflow_dispatch' && inputs.target == 'production' && github.ref == 'refs/heads/main'))}}
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: auth-production
      cancel-in-progress: false
    defaults:
      run:
        working-directory: services/auth
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        run: pnpm install --frozen-lockfile
      - name: migrate
        if: github.ref == 'refs/heads/main'
        run: pnpm exec wrangler d1 migrations apply codepi-auth --remote
        env:
          CI: 'true'
      - name: deploy
        id: deploy
        if: github.ref == 'refs/heads/main'
        run: |
          out=$(pnpm exec wrangler deploy)
          echo "$out"
          version=$(printf '%s' "$out" | node ../../scripts/cloudflare/deployment-evidence.mjs worker-version)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: smoke
        # A configured Auth Worker returns its health payload with 200 JSON.
        if: github.ref == 'refs/heads/main'
        run: |
          ct=$(curl -s -o /dev/null -w '%{content_type}' --max-time 30 https://auth.codepi.app/api/health)
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 https://auth.codepi.app/api/health)
          echo "auth.codepi.app/api/health -> $code $ct (sha=$GITHUB_SHA)"
          test "$code" = 200
          case "$ct" in application/json*) ;; *) exit 1;; esac
      - name: record deployment evidence
        if: github.ref == 'refs/heads/main'
        run: >-
          node ../../scripts/cloudflare/deployment-evidence.mjs append
          --file "$RUNNER_TEMP/deployment-evidence.jsonl"
          --service auth --target production --sha "$GITHUB_SHA"
          --provider worker --identifier "${{ steps.deploy.outputs.version }}" --smoke pass
      - name: upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-evidence-auth-production
          path: ${{ runner.temp }}/deployment-evidence.jsonl
          if-no-files-found: ignore
          retention-days: 30

  www-deploy-production:
    needs: [governance, affected, www-build, auth-deploy-production]
    if: >-
      ${{!failure() && !cancelled() && needs.affected.outputs.web == 'yes'
        && ((github.event_name == 'push' && github.ref == 'refs/heads/main')
          || (github.event_name == 'workflow_dispatch' && inputs.target == 'production' && github.ref == 'refs/heads/main'))}}
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: www-production
      cancel-in-progress: false
    defaults:
      run:
        working-directory: apps/web
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        run: pnpm install --frozen-lockfile
      - name: build
        run: npm run build
      - name: migrate
        if: github.ref == 'refs/heads/main'
        run: pnpm exec wrangler d1 migrations apply codepi-desk --remote
        env:
          CI: 'true'
      - name: deploy
        id: deploy
        if: github.ref == 'refs/heads/main'
        run: |
          out=$(pnpm exec wrangler deploy)
          echo "$out"
          version=$(printf '%s' "$out" | node ../../scripts/cloudflare/deployment-evidence.mjs worker-version)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: verify runtime configuration
        id: runtime
        if: github.ref == 'refs/heads/main'
        run: |
          origin=$(node ../../scripts/cloudflare/deployment-evidence.mjs resolve-worker \
            --script codepi-www --required-secrets AUTH_CLIENT_SECRET,HEALTH_SUMMARY_TOKEN,GU_SUMMARY_TOKEN,WECHAT_SUMMARY_TOKEN)
          echo "origin=$origin" >> "$GITHUB_OUTPUT"
      - name: smoke new Worker (pre-cutover)
        if: github.ref == 'refs/heads/main'
        env:
          WORKER_ORIGIN: ${{ steps.runtime.outputs.origin }}
        run: |
          node ../../scripts/cloudflare/check-pages.mjs web production --origin "${WORKER_ORIGIN:?Worker origin is required}"
      - name: smoke
        if: github.ref == 'refs/heads/main'
        run: node ../../scripts/cloudflare/check-pages.mjs web production
      - name: record deployment evidence
        if: github.ref == 'refs/heads/main'
        run: >-
          node ../../scripts/cloudflare/deployment-evidence.mjs append
          --file "$RUNNER_TEMP/deployment-evidence.jsonl"
          --service www --target production --sha "$GITHUB_SHA"
          --provider worker --identifier "${{ steps.deploy.outputs.version }}" --smoke pass
      - name: upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-evidence-www-production
          path: ${{ runner.temp }}/deployment-evidence.jsonl
          if-no-files-found: ignore
          retention-days: 30

  gu-deploy-production:
    needs: [governance, affected, gu-build, auth-deploy-production]
    if: >-
      ${{!failure() && !cancelled() && needs.affected.outputs.gu == 'yes'
        && ((github.event_name == 'push' && github.ref == 'refs/heads/main')
          || (github.event_name == 'workflow_dispatch' && inputs.target == 'production' && github.ref == 'refs/heads/main'))}}
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: gu-production
      cancel-in-progress: false
    defaults:
      run:
        working-directory: apps/gu
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        run: pnpm install --frozen-lockfile
      - name: build
        run: npm run build
      - name: migrate
        if: github.ref == 'refs/heads/main'
        run: pnpm exec wrangler d1 migrations apply codepi-gu --remote
        env:
          CI: 'true'
      - name: deploy
        id: deploy
        if: github.ref == 'refs/heads/main'
        run: |
          out=$(pnpm exec wrangler deploy)
          echo "$out"
          version=$(printf '%s' "$out" | node ../../scripts/cloudflare/deployment-evidence.mjs worker-version)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: verify runtime configuration
        id: runtime
        # SSO and Desk use independently paired credentials. Legacy local OTP
        # secrets are not production prerequisites. Read metadata, never values.
        if: github.ref == 'refs/heads/main'
        run: |
          origin=$(node ../../scripts/cloudflare/deployment-evidence.mjs resolve-worker \
            --script codepi-gu --required-secrets AUTH_CLIENT_SECRET,DESK_SUMMARY_TOKEN)
          echo "origin=$origin" >> "$GITHUB_OUTPUT"
      - name: smoke new Worker (pre-cutover)
        # 域名切换前 gu.codepi.app 仍指向旧 Pages；直接探测新 Worker 的
        # workers.dev 子域，让 evidence 的 --smoke pass 真正关联本次 version。
        if: github.ref == 'refs/heads/main'
        env:
          WORKER_ORIGIN: ${{ steps.runtime.outputs.origin }}
        run: |
          node ../../scripts/cloudflare/check-pages.mjs gu production --origin "${WORKER_ORIGIN:?Worker origin is required}"
      - name: smoke
        # 域名切换完成前该项探测的是旧 Pages（回归监控）；切换后即为新 Worker。
        if: github.ref == 'refs/heads/main'
        run: node ../../scripts/cloudflare/check-pages.mjs gu production
      - name: record deployment evidence
        if: github.ref == 'refs/heads/main'
        run: >-
          node ../../scripts/cloudflare/deployment-evidence.mjs append
          --file "$RUNNER_TEMP/deployment-evidence.jsonl"
          --service gu --target production --sha "$GITHUB_SHA"
          --provider worker --identifier "${{ steps.deploy.outputs.version }}" --smoke pass
      - name: upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-evidence-gu-production
          path: ${{ runner.temp }}/deployment-evidence.jsonl
          if-no-files-found: ignore
          retention-days: 30

  gzh-deploy-production:
    needs: [governance, affected, gzh-build, auth-deploy-production]
    if: >-
      ${{!failure() && !cancelled() && needs.affected.outputs.gzh == 'yes'
        && ((github.event_name == 'push' && github.ref == 'refs/heads/main')
          || (github.event_name == 'workflow_dispatch' && inputs.target == 'production' && github.ref == 'refs/heads/main'))}}
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: gzh-production
      cancel-in-progress: false
    defaults:
      run:
        working-directory: apps/gzh
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        run: pnpm install --frozen-lockfile
      - name: build
        run: npm run build
      - name: migrate
        if: github.ref == 'refs/heads/main'
        run: pnpm exec wrangler d1 migrations apply codepi-gzh --remote
        env:
          CI: 'true'
      - name: deploy
        id: deploy
        if: github.ref == 'refs/heads/main'
        run: |
          out=$(pnpm exec wrangler deploy)
          echo "$out"
          version=$(printf '%s' "$out" | node ../../scripts/cloudflare/deployment-evidence.mjs worker-version)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: verify runtime configuration
        id: runtime
        if: github.ref == 'refs/heads/main'
        run: |
          origin=$(node ../../scripts/cloudflare/deployment-evidence.mjs resolve-worker \
            --script codepi-gzh --required-secrets AUTH_CLIENT_SECRET,DESK_SUMMARY_TOKEN)
          echo "origin=$origin" >> "$GITHUB_OUTPUT"
      - name: smoke new Worker (pre-cutover)
        # Probe the new version while the custom domain may still serve Pages.
        if: github.ref == 'refs/heads/main'
        env:
          WORKER_ORIGIN: ${{ steps.runtime.outputs.origin }}
        run: |
          node ../../scripts/cloudflare/check-pages.mjs gzh production --origin "${WORKER_ORIGIN:?Worker origin is required}"
      - name: smoke
        if: github.ref == 'refs/heads/main'
        run: node ../../scripts/cloudflare/check-pages.mjs gzh production
      - name: record deployment evidence
        if: github.ref == 'refs/heads/main'
        run: >-
          node ../../scripts/cloudflare/deployment-evidence.mjs append
          --file "$RUNNER_TEMP/deployment-evidence.jsonl"
          --service gzh --target production --sha "$GITHUB_SHA"
          --provider worker --identifier "${{ steps.deploy.outputs.version }}" --smoke pass
      - name: upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-evidence-gzh-production
          path: ${{ runner.temp }}/deployment-evidence.jsonl
          if-no-files-found: ignore
          retention-days: 30

  health-api-deploy-production:
    needs: [governance, affected, health-build, auth-deploy-production, www-deploy-production, gu-deploy-production, gzh-deploy-production]
    if: >-
      ${{!failure() && !cancelled() && needs.affected.outputs.health == 'yes'
        && ((github.event_name == 'push' && github.ref == 'refs/heads/main')
          || (github.event_name == 'workflow_dispatch' && inputs.target == 'production' && github.ref == 'refs/heads/main'))}}
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: health-api-production
      cancel-in-progress: false
    defaults:
      run:
        working-directory: apps/health
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        run: pnpm install --frozen-lockfile
      - name: Deploy API before publishing its frontend
        id: deploy
        if: github.ref == 'refs/heads/main'
        run: |
          set -o pipefail
          pnpm deploy:api 2>&1 | tee "$RUNNER_TEMP/deploy-api.log"
          version=$(node ../../scripts/cloudflare/deployment-evidence.mjs worker-version < "$RUNNER_TEMP/deploy-api.log")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Check live API contract
        # Connector discovery and auth must really reach the deployed Worker.
        # A challenged 403 is a deployment failure, not a warning.
        if: github.ref == 'refs/heads/main'
        run: >-
          HEALTH_EXPECT_BUILD="${GITHUB_SHA:0:12}"
          HEALTH_CHECK_ALT_ORIGIN="https://codepi-health-api.kedoupi.workers.dev"
          pnpm check:api
      - name: record deployment evidence
        if: github.ref == 'refs/heads/main'
        run: >-
          node ../../scripts/cloudflare/deployment-evidence.mjs append
          --file "$RUNNER_TEMP/deployment-evidence.jsonl"
          --service health-api --target production --sha "$GITHUB_SHA"
          --provider worker --identifier "${{ steps.deploy.outputs.version }}" --smoke pass
      - name: upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-evidence-health-api-production
          path: ${{ runner.temp }}/deployment-evidence.jsonl
          if-no-files-found: ignore
          retention-days: 30

  health-pages-deploy-production:
    needs: [governance, affected, health-build, health-api-deploy-production]
    if: >-
      ${{!failure() && !cancelled() && needs.affected.outputs.health == 'yes'
        && ((github.event_name == 'push' && github.ref == 'refs/heads/main')
          || (github.event_name == 'workflow_dispatch' && inputs.target == 'production' && github.ref == 'refs/heads/main'))}}
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: health-pages-production
      cancel-in-progress: false
    defaults:
      run:
        working-directory: apps/health
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        run: pnpm install --frozen-lockfile
      - name: build
        run: pnpm --filter @health-kdp/web build
      - name: deploy
        # The frontend is now a Workers Static Assets Worker; Wrangler bundles
        # worker/index.ts and uploads dist. Deploy runs in apps/health/apps/web.
        id: deploy
        if: github.ref == 'refs/heads/main'
        working-directory: apps/health/apps/web
        run: |
          out=$(pnpm exec wrangler deploy)
          echo "$out"
          version=$(printf '%s' "$out" | node ../../../../scripts/cloudflare/deployment-evidence.mjs worker-version)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: verify runtime configuration
        id: runtime
        if: github.ref == 'refs/heads/main'
        working-directory: apps/health/apps/web
        run: |
          origin=$(node ../../../../scripts/cloudflare/deployment-evidence.mjs resolve-worker \
            --script codepi-health --required-secrets AUTH_CLIENT_SECRET)
          echo "origin=$origin" >> "$GITHUB_OUTPUT"
      - name: smoke new Worker (pre-cutover)
        if: github.ref == 'refs/heads/main'
        working-directory: apps/health
        env:
          HEALTH_CHECK_ALT_ORIGIN: ${{ steps.runtime.outputs.origin }}
        run: pnpm check:branding
      - name: check deployment
        if: github.ref == 'refs/heads/main'
        run: |
          HEALTH_EXPECT_BUILD="${GITHUB_SHA:0:12}" pnpm check:api
          pnpm check:branding
          ct=$(curl -s -o /dev/null -w '%{content_type}' --max-time 30 https://health.codepi.app/.well-known/oauth-protected-resource)
          echo "well-known content-type: $ct"
          case "$ct" in application/json*) ;; *) exit 1;; esac
      - name: record deployment evidence
        if: github.ref == 'refs/heads/main'
        run: >-
          node ../../scripts/cloudflare/deployment-evidence.mjs append
          --file "$RUNNER_TEMP/deployment-evidence.jsonl"
          --service health-pages --target production --sha "$GITHUB_SHA"
          --provider worker --identifier "${{ steps.deploy.outputs.version }}" --smoke pass
      - name: upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-evidence-health-pages-production
          path: ${{ runner.temp }}/deployment-evidence.jsonl
          if-no-files-found: ignore
          retention-days: 30

