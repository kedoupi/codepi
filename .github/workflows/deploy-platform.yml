name: Validate platform (auth / web / gu / gzh / health / mcp)

# This historical filename is retained for existing checks and links.
# CI validates only: no production credentials, migrations or deployment jobs.
# Releases run locally from merged main; see docs/development/local-release.md.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.npmrc'
      - 'services/auth/**'
      - 'services/mcp/**'
      - 'apps/web/**'
      - 'apps/gu/**'
      - 'apps/gzh/**'
      - 'apps/health/**'
      - 'packages/shared/**'
      - 'scripts/cloudflare/**'
      - 'scripts/agent/**'
      - '.github/workflows/d1-backup.yml'
      - '.github/workflows/production-monitor.yml'
      - '.github/dependabot.yml'
      - '.github/workflows/deploy-platform.yml'
  workflow_dispatch:

permissions:
  contents: read

# Validation only; production deployments run locally after merge.
concurrency:
  group: platform-${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test scripts/cloudflare/*.test.mjs scripts/agent/*.test.mjs
      - run: node scripts/cloudflare/validate-governance.mjs
      - run: node scripts/agent/check-migrations.mjs
      - run: node scripts/agent/lint.mjs

  affected:
    runs-on: ubuntu-latest
    outputs:
      auth: ${{ steps.map.outputs.auth }}
      web: ${{ steps.map.outputs.web }}
      gu: ${{ steps.map.outputs.gu }}
      gzh: ${{ steps.map.outputs.gzh }}
      health: ${{ steps.map.outputs.health }}
      mcp: ${{ steps.map.outputs.mcp }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Determine affected services
        id: map
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          all_trigger='^(package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|\.npmrc$|services/auth/|packages/shared/|scripts/cloudflare/|\.github/workflows/deploy-platform\.yml$)'
          mark_all() { for s in auth web gu gzh health mcp; do echo "$s=yes" >> "$GITHUB_OUTPUT"; done; }
          for s in auth web gu gzh health mcp; do echo "$s=no" >> "$GITHUB_OUTPUT"; done
          if [ "$EVENT" = 'push' ] || [ "$EVENT" = 'workflow_dispatch' ]; then
            mark_all
            exit 0
          elif [ "$EVENT" = 'pull_request' ]; then
            changed=$(git diff --name-only "$PR_BASE...$PR_HEAD") || {
              echo "::error::could not determine changed paths for pull request"
              exit 1
            }
          else
            echo "::error::unsupported validation event: $EVENT"
            exit 1
          fi
          if printf '%s\n' "$changed" | grep -qE "$all_trigger"; then
            mark_all
            exit 0
          fi
          if printf '%s\n' "$changed" | grep -qE '^apps/web/'; then
            echo 'web=yes' >> "$GITHUB_OUTPUT"
          fi
          if printf '%s\n' "$changed" | grep -qE '^apps/gu/'; then
            echo 'gu=yes' >> "$GITHUB_OUTPUT"
          fi
          if printf '%s\n' "$changed" | grep -qE '^apps/gzh/'; then
            echo 'gzh=yes' >> "$GITHUB_OUTPUT"
          fi
          if printf '%s\n' "$changed" | grep -qE '^apps/health/'; then
            echo 'health=yes' >> "$GITHUB_OUTPUT"
            echo 'mcp=yes' >> "$GITHUB_OUTPUT"
          fi
          if printf '%s\n' "$changed" | grep -qE '^services/mcp/'; then
            echo 'mcp=yes' >> "$GITHUB_OUTPUT"
          fi


  # ---------------- Local checks ----------------

  mcp-build:
    needs: [affected]
    if: ${{needs.affected.outputs.mcp == 'yes'}}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/mcp
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:browser:built


  auth-build:
    needs: [affected]
    if: >-
      ${{needs.affected.outputs.auth == 'yes'}}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/auth
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        run: pnpm install --frozen-lockfile
      - run: npm test
      - run: npm run typecheck

  www-build:
    needs: [affected]
    if: >-
      ${{needs.affected.outputs.web == 'yes'}}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        run: pnpm install --frozen-lockfile
      - run: npm test
      - run: npm run typecheck:desk
      - run: npm run build
      - run: npm run test:assets

  gu-build:
    needs: [affected]
    if: >-
      ${{needs.affected.outputs.gu == 'yes'}}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/gu
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        run: pnpm install --frozen-lockfile
      - run: npm test
      - run: npm run test:scripts
      - run: npm run typecheck
      - run: npm run build

  gzh-build:
    needs: [affected]
    if: >-
      ${{needs.affected.outputs.gzh == 'yes'}}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/gzh
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        run: pnpm install --frozen-lockfile
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  health-build:
    needs: [affected]
    if: >-
      ${{needs.affected.outputs.health == 'yes'}}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/health
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        run: pnpm install --frozen-lockfile
      - run: node --experimental-strip-types --test ../../packages/shared/auth/client.test.mjs
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm --filter @health-kdp/web build
      - run: pnpm test:assets
      - name: Install Chinese fonts for browser screenshots
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: Browser regression (normal and SSO)
        timeout-minutes: 15
        run: pnpm test:browser:built
        env:
          HEALTH_BROWSER_ARTIFACTS: ${{ runner.temp }}/health-browser-artifacts
      - name: Upload browser screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: health-browser-${{ github.run_attempt }}
          path: ${{ runner.temp }}/health-browser-artifacts
          if-no-files-found: ignore
          retention-days: 7
