name: Retry Health API deployment after D1 quota reset

# 只重试 deploy-platform.yml 中 Health API production deploy 被 D1 免费额度
# 日写限制阻断的失败 run；其它失败不会被 rerun。
on:
  schedule:
    # D1 free daily limits reset at midnight UTC (08:00 Asia/Shanghai).
    - cron: '10 0 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: oura-quota-deploy-retry
  cancel-in-progress: false

jobs:
  retry-quota-failure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Retry only a deployment blocked by the D1 daily write quota
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node apps/oura/scripts/retry-quota-deploy.mjs
