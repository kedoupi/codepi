name: Validate SSO and GU

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.npmrc'
      - 'services/auth/**'
      - 'apps/gu/**'
      - 'packages/shared/auth/**'
      - 'packages/shared/styles/**'
      - 'packages/shared/email/**'
      - 'packages/shared/brand.ts'
      - '.github/workflows/validate-sso.yml'
  pull_request:
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.npmrc'
      - 'services/auth/**'
      - 'apps/gu/**'
      - 'packages/shared/auth/**'
      - 'packages/shared/styles/**'
      - 'packages/shared/email/**'
      - 'packages/shared/brand.ts'
      - '.github/workflows/validate-sso.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [services/auth, apps/gu]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        run: pnpm install --frozen-lockfile
      - run: npm test
      - run: npm run test:scripts
        if: matrix.app == 'apps/gu'
      - run: npm run typecheck
      - run: npm run build
      - run: npm run check:deploy
        if: matrix.app == 'apps/gu'
