name: Deploy product apps (gzh / oura)

on:
  push:
    branches: [main]
    paths:
      - 'gzh/**'
      - 'oura/**'
      - 'shared/auth/**'
      - 'shared/styles/**'
      - 'shared/email/**'
      - 'shared/brand.ts'
      - '.github/workflows/deploy-product-apps.yml'
  pull_request:
    paths:
      - 'gzh/**'
      - 'oura/**'
      - 'shared/auth/**'
      - 'shared/styles/**'
      - 'shared/email/**'
      - 'shared/brand.ts'
      - '.github/workflows/deploy-product-apps.yml'
  workflow_dispatch:
    inputs:
      app:
        description: 'Which app to deploy'
        required: true
        default: 'all'
        type: choice
        options: [all, gzh, oura]

jobs:
  gzh:
    # Push: runs but skips internally unless gzh/ changed. Dispatch: explicit selector.
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.app == 'all' || inputs.app == 'gzh' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gzh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Skip when this push did not touch gzh
        if: github.event_name == 'push'
        id: changed
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -qE '^(gzh/|shared/auth/|shared/email/|shared/brand\.ts$|\.github/workflows/deploy-product-apps\.yml$)'; then
            echo "touched=yes" >> "$GITHUB_OUTPUT"
          else
            echo "touched=no" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: github.event_name != 'push' || steps.changed.outputs.touched == 'yes'
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: gzh/package-lock.json
      - if: github.event_name != 'push' || steps.changed.outputs.touched == 'yes'
        run: npm ci
      - if: github.event_name != 'push' || steps.changed.outputs.touched == 'yes'
        run: npm test
      - if: github.event_name != 'push' || steps.changed.outputs.touched == 'yes'
        run: npm run typecheck
      - if: github.event_name != 'push' || steps.changed.outputs.touched == 'yes'
        run: npm run build
        if: github.event_name != 'pull_request' && (github.event_name != 'push' || steps.changed.outputs.touched == 'yes')
        run: npx wrangler d1 migrations apply codepi-gzh --remote
        env:
          CI: 'true'
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - if: github.event_name != 'pull_request' && (github.event_name != 'push' || steps.changed.outputs.touched == 'yes')
        run: npx wrangler@4 pages deploy dist --project-name=codepi-gzh --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  oura:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.app == 'all' || inputs.app == 'oura' }}
    runs-on: ubuntu-latest
    concurrency:
      group: oura-${{ github.ref }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: oura
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Skip when this push did not touch oura
        if: github.event_name == 'push'
        id: changed
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -qE '^(oura/|shared/auth/|shared/styles/|\.github/workflows/deploy-product-apps\.yml$)'; then
            echo "touched=yes" >> "$GITHUB_OUTPUT"
          else
            echo "touched=no" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@v4
        if: github.event_name != 'push' || steps.changed.outputs.touched == 'yes'
        with:
          version: 9
      - uses: actions/setup-node@v4
        if: github.event_name != 'push' || steps.changed.outputs.touched == 'yes'
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: oura/pnpm-lock.yaml
      - if: github.event_name != 'push' || steps.changed.outputs.touched == 'yes'
        run: pnpm i --frozen-lockfile
      - if: github.event_name != 'push' || steps.changed.outputs.touched == 'yes'
        run: node --experimental-strip-types --test ../shared/auth/client.test.mjs
      - if: github.event_name != 'push' || steps.changed.outputs.touched == 'yes'
        run: pnpm test
      - if: github.event_name != 'push' || steps.changed.outputs.touched == 'yes'
        run: pnpm typecheck
      - if: github.event_name != 'push' || steps.changed.outputs.touched == 'yes'
        run: pnpm --filter @oura-kdp/web build
      - name: Install Chinese fonts for browser screenshots
        if: github.event_name != 'push' || steps.changed.outputs.touched == 'yes'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: Browser regression (normal and SSO)
        if: github.event_name != 'push' || steps.changed.outputs.touched == 'yes'
        timeout-minutes: 15
        run: pnpm test:browser:built
        env:
          OURA_BROWSER_ARTIFACTS: ${{ runner.temp }}/oura-browser-artifacts
      - name: Upload browser screenshots and diagnostics
        if: always() && (github.event_name != 'push' || steps.changed.outputs.touched == 'yes')
        uses: actions/upload-artifact@v4
        with:
          name: oura-browser-${{ github.run_attempt }}
          path: ${{ runner.temp }}/oura-browser-artifacts
          if-no-files-found: ignore
          retention-days: 7
      - name: Deploy API before publishing its frontend
        if: github.event_name != 'pull_request' && (github.event_name != 'push' || steps.changed.outputs.touched == 'yes')
        run: pnpm deploy:api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_SHA: ${{ github.sha }}
      - name: Check live API contract
        if: github.event_name != 'pull_request' && (github.event_name != 'push' || steps.changed.outputs.touched == 'yes')
        # Connector discovery and auth must really reach the deployed Worker.
        # A challenged 403 is a deployment failure, not a warning.
        run: >-
          OURA_EXPECT_BUILD="${GITHUB_SHA:0:12}"
          OURA_CHECK_ALT_ORIGIN="https://codepi-health-api.kedoupi.workers.dev"
          pnpm check:api
      - name: Publish frontend
        if: github.event_name != 'pull_request' && (github.event_name != 'push' || steps.changed.outputs.touched == 'yes')
        # Wrangler discovers Pages Functions from process.cwd()/functions, so the
        # deploy must run in apps/web (where functions/ lives), not workers/api.
        run: pnpm --dir apps/web exec wrangler pages deploy dist --project-name=codepi-health --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Check deployment
        if: github.event_name != 'pull_request' && (github.event_name != 'push' || steps.changed.outputs.touched == 'yes')
        run: |
          OURA_EXPECT_BUILD="${GITHUB_SHA:0:12}" pnpm check:api
          pnpm check:branding

