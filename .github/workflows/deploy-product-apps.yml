name: Deploy product apps (fagao / oura)

on:
  push:
    branches: [main]
    paths:
      - 'fagao/**'
      - 'oura/**'
      - '.github/workflows/deploy-product-apps.yml'
  pull_request:
    paths:
      - 'oura/**'
      - '.github/workflows/deploy-product-apps.yml'
  workflow_dispatch:
    inputs:
      app:
        description: 'Which app to deploy'
        required: true
        default: 'all'
        type: choice
        options: [all, fagao, oura]

jobs:
  fagao:
    if: ${{ github.event_name == 'push' || inputs.app == 'all' || inputs.app == 'fagao' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fagao
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: fagao/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx wrangler@4 pages deploy dist --project-name=fagao --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  oura:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' || inputs.app == 'all' || inputs.app == 'oura' }}
    runs-on: ubuntu-latest
    concurrency:
      group: oura-${{ github.ref }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: oura
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: oura/pnpm-lock.yaml
      - run: pnpm i --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm --filter @oura-kdp/web build
      - name: Deploy API before publishing its frontend
        if: github.event_name != 'pull_request'
        run: pnpm deploy:api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Check live API contract
        if: github.event_name != 'pull_request'
        run: OURA_CHECK_ALLOW_CF_ACCESS=1 pnpm check:api
      - name: Publish frontend
        if: github.event_name != 'pull_request'
        run: pnpm --filter @oura-kdp/api exec wrangler pages deploy ../../apps/web/dist --project-name=oura-kdp --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Check deployment
        if: github.event_name != 'pull_request'
        run: OURA_CHECK_ALLOW_CF_ACCESS=1 pnpm check:api

