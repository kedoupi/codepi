name: Deploy product apps (fagao / oura / gzh-preview)

on:
  push:
    branches: [main]
    paths:
      - 'fagao/**'
      - 'oura/**'
      - 'gzh-preview/**'
      - '.github/workflows/deploy-product-apps.yml'
  workflow_dispatch:
    inputs:
      app:
        description: 'Which app to deploy'
        required: true
        default: 'all'
        type: choice
        options: [all, fagao, oura, gzh-preview]

jobs:
  fagao:
    if: ${{ github.event_name == 'push' || inputs.app == 'all' || inputs.app == 'fagao' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fagao
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: fagao/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx wrangler@4 pages deploy dist --project-name=fagao --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  oura-web:
    if: ${{ github.event_name == 'push' || inputs.app == 'all' || inputs.app == 'oura' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: oura
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: oura/pnpm-lock.yaml
      - run: pnpm i
      - run: pnpm --filter @oura-kdp/web build
      - run: npx wrangler@4 pages deploy apps/web/dist --project-name=oura-kdp --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  gzh-preview:
    if: ${{ github.event_name == 'push' || inputs.app == 'all' || inputs.app == 'gzh-preview' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gzh-preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: gzh-preview/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx wrangler@4 pages deploy public --project-name=gzh-preview --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
