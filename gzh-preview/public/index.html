<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>公号预览工作台</title>
<link rel="stylesheet" href="/styles.css"/>
</head>
<body>
  <div id="app"><div class="wb"><p class="hint">正在加载待审队列…</p></div></div>
  <script type="module">
    import { bindHome, loadBoard } from "/app.js";
    const app = document.getElementById("app");
    try {
      const board = await loadBoard();
      bindHome(app, board);
    } catch (err) {
      app.innerHTML = `<div class="wb"><p class="toast err">加载失败：${err.message}</p></div>`;
    }
  </script>
</body>
</html>
