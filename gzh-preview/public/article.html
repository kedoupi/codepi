<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>审稿 · 公号预览工作台</title>
<link rel="stylesheet" href="/styles.css"/>
</head>
<body class="mode-phone">
  <div class="stage">
    <div class="toolbar">
      <div class="left"><a href="/">← 返回工作台</a></div>
      <div class="seg" role="group" aria-label="预览宽度">
        <button type="button" id="mode-phone" class="on">手机</button>
        <button type="button" id="mode-desktop">桌面</button>
      </div>
      <div class="hint" id="meta">加载中…</div>
      <div class="qr-inline">
        <img id="qr" alt="文章二维码" width="56" height="56"/>
        <a id="qr-url" href="#" target="_blank" rel="noopener"></a>
      </div>
    </div>
    <div class="frame-wrap">
      <iframe class="article" id="frame" title="文章预览" src="about:blank"></iframe>
    </div>
  </div>
  <div class="review-bar">
    <textarea id="note" placeholder="要改 / 拒 时可写备注（可选）" maxlength="500"></textarea>
    <div class="row">
      <button type="button" class="btn btn-pass" data-action="过">过 → 可推箱</button>
      <button type="button" class="btn btn-change" data-action="要改">要改 → 需改</button>
      <button type="button" class="btn btn-reject" data-action="拒">拒 → 需改</button>
      <span class="toast" id="toast"></span>
    </div>
  </div>
  <script type="module">
    import { loadBoard, postReview, previewUrl, qrImgUrl, escapeHtml } from "/app.js";

    const id = new URLSearchParams(location.search).get("id") || "";
    const meta = document.getElementById("meta");
    const toast = document.getElementById("toast");
    const noteEl = document.getElementById("note");
    const frame = document.getElementById("frame");
    const qr = document.getElementById("qr");
    const qrUrl = document.getElementById("qr-url");

    function setMode(mode) {
      document.body.classList.toggle("mode-phone", mode === "phone");
      document.body.classList.toggle("mode-desktop", mode === "desktop");
      document.getElementById("mode-phone").classList.toggle("on", mode === "phone");
      document.getElementById("mode-desktop").classList.toggle("on", mode === "desktop");
    }
    document.getElementById("mode-phone").onclick = () => setMode("phone");
    document.getElementById("mode-desktop").onclick = () => setMode("desktop");

    function paint(article) {
      document.title = `${article.title} · 审稿`;
      meta.innerHTML = `${article.slot ? `<span class="badge-slot">${escapeHtml(article.slot)}</span>` : ""}<span class="badge-st st-${escapeHtml(article.status)}">${escapeHtml(article.status)}</span> ${escapeHtml(article.title)}`;
      frame.src = previewUrl(article);
      qr.src = qrImgUrl(article.url, 120);
      qrUrl.href = article.url;
      qrUrl.textContent = article.url;
      noteEl.value = article.note || "";
    }

    let article;
    try {
      const board = await loadBoard();
      article = (board.articles || []).find((item) => item.id === id);
      if (!article) throw new Error("board 里没有这篇文章");
      paint(article);
    } catch (err) {
      meta.textContent = `加载失败：${err.message}`;
    }

    async function submit(action) {
      if (!article) return;
      const buttons = [...document.querySelectorAll("[data-action]")];
      buttons.forEach((btn) => { btn.disabled = true; });
      toast.className = "toast";
      toast.textContent = "提交中…";
      try {
        const data = await postReview({
          id: article.id,
          action,
          note: noteEl.value.trim(),
        });
        article = data.article;
        paint(article);
        toast.className = "toast ok";
        toast.textContent = `已记为「${article.status}」`;
      } catch (err) {
        toast.className = "toast err";
        toast.textContent = err.message;
      } finally {
        buttons.forEach((btn) => { btn.disabled = false; });
      }
    }

    document.querySelectorAll("[data-action]").forEach((btn) => {
      btn.addEventListener("click", () => submit(btn.dataset.action));
    });
  </script>
</body>
</html>
