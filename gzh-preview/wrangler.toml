name = "gzh-preview"
main = "src/index.js"
compatibility_date = "2026-09-16"

[observability]
enabled = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# 老王：npx wrangler kv namespace create BOARD_KV
# 把返回的 id 填到下面（本地 wrangler dev 用占位即可）
[[kv_namespaces]]
binding = "BOARD_KV"
id = "<KV_NAMESPACE_ID>"
