name = "codepi-health-api"
main = "src/index.ts"
rules = [{ type = "Text", globs = ["**/tokens.css"], fallthrough = true }]
compatibility_date = "2025-01-01"
routes = [
  { pattern = "health.codepi.app/api/*", zone_name = "codepi.app" },
  { pattern = "health.codepi.app/mcp", zone_name = "codepi.app" },
  { pattern = "health.codepi.app/oauth*", zone_name = "codepi.app" },
  { pattern = "health.codepi.app/.well-known*", zone_name = "codepi.app" }
]

[vars]
ENVIRONMENT = "production"
AUTO_SYNC_ENABLED = "1"
ALLOW_DEV_LOGIN = "0"
SSO_ENABLED = "1"
AUTH_CLIENT_ID = "oura"
AUTH_ORIGIN = "https://auth.codepi.app"
FRONTEND_ORIGIN = "https://health.codepi.app"
FRONTEND_ORIGINS = "https://health.codepi.app"
OURA_REDIRECT_URI = "https://health.codepi.app/api/auth/oura/callback"
# Set by scripts/deploy-api.mjs at release time to the short source SHA so
# /api/health and the smoke gate can prove which build is live. Local dev
# leaves it unset and the routes fall back to "local". Never commit a real SHA.
BUILD_SHA = "local"

[triggers]
crons = ["*/2 * * * *"]

[[services]]
binding = "AUTH"
service = "codepi-auth"

[[d1_databases]]
binding = "DB"
database_name = "codepi-health"
# Production D1: codepi-health
database_id = "2e35deaa-8066-49c1-b19a-afcd8706d58c"
migrations_dir = "../../migrations"

# Secrets via `wrangler secret put` / `.dev.vars` — never commit real values:
#   OURA_CLIENT_ID, OURA_CLIENT_SECRET, TOKEN_ENCRYPTION_KEY, SESSION_SECRET
# SSO rollout additionally needs AUTH_CLIENT_SECRET, PERSONAL_OWNER_ID and an
# AUTH service binding to the central auth Worker. Keep SSO_ENABLED=0 until that
# binding and the registered /api/auth/callback are ready.
# Production URLs and the API route are declared above.
# ALLOW_DEV_LOGIN=1 on preview/test Workers; unset / 0 in production.

# staging 环境：唯一持久云端集成环境。独立 D1、独立 Auth service binding、
# staging 域名 routes；关闭自动同步与生产副作用，不配置 production provider
# credentials。secret 名同生产（OURA_CLIENT_ID、OURA_CLIENT_SECRET、
# TOKEN_ENCRYPTION_KEY、SESSION_SECRET、AUTH_CLIENT_SECRET、PERSONAL_OWNER_ID），
# 用 `wrangler secret put --env staging` 设置 staging 专属值。
[env.staging]
name = "codepi-health-api-staging"
routes = [
  { pattern = "health-staging.codepi.app/api/*", zone_name = "codepi.app" },
  { pattern = "health-staging.codepi.app/mcp", zone_name = "codepi.app" },
  { pattern = "health-staging.codepi.app/oauth*", zone_name = "codepi.app" },
  { pattern = "health-staging.codepi.app/.well-known*", zone_name = "codepi.app" }
]

[env.staging.vars]
ENVIRONMENT = "staging"
AUTO_SYNC_ENABLED = "0"
ALLOW_DEV_LOGIN = "0"
SSO_ENABLED = "1"
AUTH_CLIENT_ID = "oura"
AUTH_ORIGIN = "https://auth-staging.codepi.app"
FRONTEND_ORIGIN = "https://health-staging.codepi.app"
FRONTEND_ORIGINS = "https://health-staging.codepi.app"
OURA_REDIRECT_URI = "https://health-staging.codepi.app/api/auth/oura/callback"

[env.staging.triggers]
crons = ["*/2 * * * *"]

[[env.staging.services]]
binding = "AUTH"
service = "codepi-auth-staging"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "codepi-health-staging"
database_id = "36430305-83df-4af6-961f-64abedca02fe"
migrations_dir = "../../migrations"
