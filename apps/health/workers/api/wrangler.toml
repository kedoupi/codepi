name = "codepi-health-api"
main = "src/index.ts"
rules = [{ type = "Text", globs = ["**/tokens.css"], fallthrough = true }]
compatibility_date = "2025-01-01"
# 无公网 routes：health.codepi.app 整体绑定到前端 SPA Worker（apps/web），
# API/MCP/OAuth 请求由前端 Worker 经 WORKER service binding 转发到本 Worker。
# 保留 cron 触发器用于自动同步；域名切换后 zone 内不得残留本 Worker 的兜底路由。

[vars]
ENVIRONMENT = "production"
AUTO_SYNC_ENABLED = "1"
ALLOW_DEV_LOGIN = "0"
SSO_ENABLED = "1"
AUTH_CLIENT_ID = "oura"
AUTH_ORIGIN = "https://auth.codepi.app"
FRONTEND_ORIGIN = "https://health.codepi.app"
FRONTEND_ORIGINS = "https://health.codepi.app"
OURA_REDIRECT_URI = "https://health.codepi.app/api/auth/oura/callback"
# Set by scripts/deploy-api.mjs at release time to the short source SHA so
# /api/health and the smoke gate can prove which build is live. Local dev
# leaves it unset and the routes fall back to "local". Never commit a real SHA.
BUILD_SHA = "local"

[triggers]
crons = ["*/2 * * * *"]

[[services]]
binding = "AUTH"
service = "codepi-auth"

[[d1_databases]]
binding = "DB"
database_name = "codepi-health"
# Production D1: codepi-health
database_id = "2e35deaa-8066-49c1-b19a-afcd8706d58c"
migrations_dir = "../../migrations"
