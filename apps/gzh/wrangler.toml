# 发稿台 · Cloudflare Worker `codepi-gzh`
# 生产域名：https://gzh.codepi.app
# 密钥禁止写入本文件，通过 secret API 配置（见 README）

"$schema" = "./node_modules/wrangler/config-schema.json"
name = "codepi-gzh"
main = "worker/index.ts"
compatibility_date = "2026-09-16"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"
# 私有预览正文必须先经过 Worker 会话门；SPA 路由也由 Worker 决定。
run_worker_first = true

[[services]]
binding = "AUTH"
service = "codepi-auth"

# 一期空库已建好，与 oura D1 隔离
[[d1_databases]]
binding = "DB"
database_name = "codepi-gzh"
database_id = "acedb64c-d374-4e40-b61e-7df7f0766694"
migrations_dir = "migrations"

[vars]
SSO_ENABLED = "1"
AUTH_CLIENT_ID = "gzh"
AUTH_ORIGIN = "https://auth.codepi.app"
ALLOWLIST = "kedoupi@gmail.com"
OTP_FROM = "otp@kdp.cool"
ACCOUNT_BRAND = "珂抖屁"
ENVIRONMENT = "production"

# staging named environment 保留未启用，不接发布入口。
# 继承顶层 [assets]；禁止覆盖资产配置绕过会话门。
[env.staging]
name = "codepi-gzh-staging"

[[env.staging.services]]
binding = "AUTH"
service = "codepi-auth-staging"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "codepi-gzh-staging"
database_id = "1a57d7d8-6d16-4f16-b9f6-b78f78b714ab"
migrations_dir = "migrations"

[env.staging.vars]
SSO_ENABLED = "1"
AUTH_CLIENT_ID = "gzh"
AUTH_ORIGIN = "https://auth-staging.codepi.app"
ALLOWLIST = "kedoupi@gmail.com"
OTP_FROM = "otp@kdp.cool"
ACCOUNT_BRAND = "珂抖屁"
ENVIRONMENT = "staging"
