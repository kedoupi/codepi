name = "codepi-gu"
main = "worker/index.ts"
compatibility_date = "2026-09-16"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"
# 全站鉴权应用：所有请求（包括静态资产）必须先进 Worker，资产不得绕过会话门。
# 不配置 not_found_handling：404/页面语义由 Hono 路由链承担，与 Pages 时期一致。
run_worker_first = true

[[services]]
binding = "AUTH"
service = "codepi-auth"

[vars]
SSO_ENABLED = "1"
AUTH_CLIENT_ID = "gu"
AUTH_ORIGIN = "https://auth.codepi.app"
ENVIRONMENT = "production"
OTP_FROM = "otp@kdp.cool"

[[d1_databases]]
binding = "DB"
database_name = "codepi-gu"
database_id = "4d3b6713-85dd-4f61-ac55-9925db72394b"
migrations_dir = "migrations"

[observability]
enabled = true
head_sampling_rate = 1
redact_query_string = true

[observability.logs]
enabled = true
invocation_logs = true
persist = true
