name = "codepi-gu"
pages_build_output_dir = "./dist"
compatibility_date = "2026-09-16"
compatibility_flags = ["nodejs_compat"]

[[services]]
binding = "AUTH"
service = "codepi-auth"

[vars]
SSO_ENABLED = "1"
AUTH_CLIENT_ID = "gu"
AUTH_ORIGIN = "https://auth.codepi.app"
ENVIRONMENT = "production"
OTP_FROM = "otp@kdp.cool"

[[d1_databases]]
binding = "DB"
database_name = "codepi-gu"
database_id = "4d3b6713-85dd-4f61-ac55-9925db72394b"
migrations_dir = "migrations"

# Pages preview 环境 = staging runtime（治理规范第 4 节）：仅由 staging branch
# 通过 Actions 上传，绑定 staging D1 与 codepi-auth-staging。
[env.preview.vars]
SSO_ENABLED = "1"
AUTH_CLIENT_ID = "gu"
OTP_FROM = "otp@kdp.cool"
AUTH_ORIGIN = "https://auth-staging.codepi.app"
ENVIRONMENT = "staging"

[[env.preview.services]]
binding = "AUTH"
service = "codepi-auth-staging"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "codepi-gu-staging"
database_id = "86d7d48c-ef12-4cd6-932c-38c0a53bcded"
migrations_dir = "migrations"
