name = "codepi-project"
main = "worker/index.ts"
compatibility_date = "2026-10-18"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false
routes = [
  { pattern = "project.codepi.app", custom_domain = true }
]
# 清除线上 2026-10-20 残留的 */15 定时任务；Project 没有 scheduled 处理函数。
[triggers]
crons = []

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true

[vars]
ENVIRONMENT = "production"
SSO_ENABLED = "1"
AUTH_CLIENT_ID = "project"
AUTH_ORIGIN = "https://auth.codepi.app"
PROJECT_ORIGIN = "https://project.codepi.app"
BUILD_SHA = "local"

[[services]]
binding = "AUTH"
service = "codepi-auth"

[[d1_databases]]
binding = "DB"
database_name = "codepi-project"
migrations_dir = "migrations"

[observability]
enabled = true
head_sampling_rate = 1
redact_query_string = true

[observability.issues]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true
persist = true
