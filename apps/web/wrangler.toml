name = "codepi-www"
main = "worker/index.ts"
compatibility_date = "2026-09-16"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*", "/desk", "/desk/*", "/blog/*", "/sitemap-blog.xml"]
not_found_handling = "404-page"

[[services]]
binding = "AUTH"
service = "codepi-auth"

[[d1_databases]]
binding = "DB"
database_name = "codepi-desk"
database_id = "adfb0f6e-b776-471b-9f25-71982b53cbc4"
migrations_dir = "migrations"

[[d1_databases]]
binding = "BLOG"
database_name = "codepi-blog"
database_id = "22e27bb5-230a-4b89-b969-3dc29c8a1d22"
migrations_dir = "migrations-blog"

[vars]
SSO_ENABLED = "1"
AUTH_CLIENT_ID = "desk"
AUTH_ORIGIN = "https://auth.codepi.app"
ENVIRONMENT = "production"

[observability]
enabled = true
head_sampling_rate = 1
redact_query_string = true

[observability.issues]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true
persist = true
