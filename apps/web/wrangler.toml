name = "codepi-www"
main = "worker/index.ts"
compatibility_date = "2026-09-16"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*", "/desk", "/desk/*"]
not_found_handling = "404-page"

[[services]]
binding = "AUTH"
service = "codepi-auth"

[[d1_databases]]
binding = "DB"
database_name = "codepi-desk"
database_id = "adfb0f6e-b776-471b-9f25-71982b53cbc4"
migrations_dir = "migrations"

[vars]
SSO_ENABLED = "1"
AUTH_CLIENT_ID = "desk"
AUTH_ORIGIN = "https://auth.codepi.app"
ENVIRONMENT = "production"

# staging named environment 保留未启用，继承顶层 assets，不接发布入口。
[env.staging]
name = "codepi-www-staging"

[[env.staging.services]]
binding = "AUTH"
service = "codepi-auth-staging"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "codepi-desk-staging"
database_id = "cbbe0037-4132-4ec2-bf6b-2c1ff4363977"
migrations_dir = "migrations"

[env.staging.vars]
SSO_ENABLED = "1"
AUTH_CLIENT_ID = "desk"
AUTH_ORIGIN = "https://auth-staging.codepi.app"
ENVIRONMENT = "staging"
